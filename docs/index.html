<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>リアル脱出ゲーム 名古屋 空き状況</title>

  <!-- iPhoneホーム画面アイコン。最初のHTMLに置くことでiOSが確実に認識する（重要・変更しない） -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- ホーム画面追加時の表示名・挙動 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="脱出空き状況">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2F6FED">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ヘッダー -->
    <header class="app-header">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </div>
      <div>
        <div class="title">リアル脱出ゲーム 名古屋</div>
        <div class="sub">チケット空き状況チェッカー</div>
      </div>
    </header>

    <!-- 画面切り替え -->
    <nav class="view-switch" id="viewSwitch">
      <button class="view-btn active" data-view="event">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 16.5A1.5 1.5 0 0 0 3.5 18h17a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 20.5 6h-17A1.5 1.5 0 0 0 2 7.5v9zM12 8a2 2 0 0 1 0 4 2 2 0 0 1 0-4z"/></svg>
        演目から探す
      </button>
      <button class="view-btn" data-view="date">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg>
        日付から探す
      </button>
      <button class="view-btn" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
        カレンダー
      </button>
    </nav>

    <!-- 設定（旧サイドバー） -->
    <details class="panel" id="settingsPanel">
      <summary>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.18.12.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        設定
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </summary>
      <div class="panel-body">

        <!-- 参加人数 -->
        <div class="setting-block">
          <div class="setting-label">参加予定人数</div>
          <div class="stepper">
            <button type="button" id="grpMinus" aria-label="減らす">−</button>
            <span class="val" id="grpVal">4</span>
            <button type="button" id="grpPlus" aria-label="増やす">＋</button>
          </div>
        </div>

        <!-- 満員非表示 -->
        <div class="setting-block">
          <label class="check-row">
            <input type="checkbox" id="hideFull" checked>
            満員の枠を非表示
          </label>
        </div>

        <!-- 絞り込み -->
        <div class="setting-block">
          <div class="setting-label">絞り込み <span class="setting-hint">（未選択＝すべて表示）</span></div>
          <div style="margin-bottom:.5rem">
            <div class="muted" style="margin-bottom:.3rem">種別</div>
            <div class="pills" id="filterTypes"></div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:.3rem">時間帯</div>
            <div class="pills" id="filterTimes"></div>
          </div>
        </div>

        <!-- 除外演目 -->
        <div class="setting-block">
          <div class="setting-label">検索から除外する演目</div>
          <div class="exclude-scroll" id="excludeList"></div>
        </div>

        <!-- 更新 -->
        <div class="setting-block">
          <button class="btn full" id="refreshBtn" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            データを今すぐ更新
          </button>
          <div class="foot-note" id="updatedInfo"></div>
        </div>

      </div>
    </details>

    <!-- ビュー本体 -->
    <main id="viewRoot"></main>

  </div>

  <!-- ピッカー等のモーダル差し込み先 -->
  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
